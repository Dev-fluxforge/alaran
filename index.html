<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <base href="/" />
    <title>Alaran Geo-Service | Accuracy & Speed</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="description"
        content="Professional surveying company in Lagos, Nigeria: Engineering Surveying, Cadastral Surveying, Hydrographic Surveying, and Aerial Mapping &amp; Remote Sensing." />
    <meta name="keywords"
        content="Alaran Geo-Service, Alaran Geo Services, AGSL, engineering surveying, cadastral surveying, hydrographic surveying, aerial mapping, remote sensing, land surveying Lagos, Nigeria, GIS" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "@id": "https://a-gsl.com/#organization",
      "name": "Alaran Geo-Service Limited",
      "alternateName": ["Alaran Geo Services", "AGSL"],
      "url": "https://a-gsl.com/",
      "logo": "https://a-gsl.com/icons/orgl.png",
      "description": "Professional surveying and geospatial solutions company serving Lagos and the whole of Nigeria.",
      "email": "director@a-gsl.com",
      "telephone": "+2348144889705",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "18, Agidi Road, near Oshogun Busstop, Ketu Alapere",
        "addressLocality": "Lagos",
        "addressCountry": "NG"
      },
      "areaServed": { "@type": "Country", "name": "Nigeria" },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Core Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Engineering Surveying",
              "description": "Survey support for the construction of roads, bridges, and buildings using Total Stations, GNSS receivers, and leveling machines, from setting out to as-built delivery."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Cadastral Surveying",
              "description": "Boundary dispute resolution, perimeter mapping, and land titling documentation using Total Stations and RTK GNSS receivers."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Hydrographic Surveying",
              "description": "Marine and underwater surveys for coastal and offshore projects, including geophysical mapping, pipeline installations, and marine construction, using echo sounders and side-scan sonar."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Aerial Mapping & Remote Sensing",
              "description": "Drone-based aerial mapping producing high-resolution orthomosaics, 3D topographic models, and contour maps for large-scale developments."
            }
          }
        ]
      }
    }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: "#19e64d",
                        "background-light": "#f6f8f6",
                        "background-dark": "#112115",
                        "accent-yellow": "#FFD700",
                        "deep-green": "#0e1b11",
                        sand: "#C2B280",
                        water: "#0077be",
                        space: "#1B1B1B",
                        "light-blue": "#ADD8E6",
                    },
                    fontFamily: {
                        display: ["Space Grotesk", "sans-serif"],
                    },
                    keyframes: {
                        "scrolling-text": {
                            "0%": { transform: "translateX(0%)" },
                            "100%": { transform: "translateX(-100%)" },
                        },
                        "scroll-linear": {
                            "0%": { transform: "translateX(0)" },
                            "100%": { transform: "translateX(-50%)" },
                        },
                        float: {
                            "0%, 100%": { transform: "translateY(-50%) rotate(6deg)" },
                            "50%": { transform: "translateY(-55%) rotate(8deg)" },
                        },
                    },
                    animation: {
                        "scrolling-text": "scrolling-text 40s linear infinite",
                        "scroll-linear": "scroll-linear 20s linear infinite",
                        float: "float 6s ease-in-out infinite",
                    },
                },
            },
        };
    </script>
    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Space Grotesk", sans-serif;
            --primary-color: #19e64d;
            --deep-green-color: #0e1b11;
        }

        .glass-nav {
            background: rgba(246, 248, 246, 0.8);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
        }

        .dark .glass-nav {
            background: rgba(17, 33, 21, 0.8);
        }

        .hero-video-container {
            position: absolute;
            top: -15%;
            left: 0;
            width: 100%;
            height: 130%;
            overflow: hidden;
            z-index: -1;
            will-change: transform;
        }

        #hero-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .service-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(25, 230, 77, 0.1);
            border-color: rgba(25, 230, 77, 0.3);
            transition: all 0.3s ease-in-out;
        }

        .material-symbols-outlined {
            font-variation-settings:
                "FILL" 0,
                "wght" 400,
                "GRAD" 0,
                "opsz" 24;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        section {
            animation: fadeIn 1s ease-out forwards;
        }

        @keyframes fadeInBackdrop {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-backdrop-fade-in {
            animation: fadeInBackdrop 0.3s ease-out forwards;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-content-slide-in-up {
            animation: slideInUp 0.4s ease-out forwards;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            70% {
                transform: scale(1.1);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .animate-pop {
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Hero Text Animation */
        @keyframes revealUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .hero-text-line {
            display: block;
            overflow: hidden;
        }

        .hero-text-line span {
            display: block;
            animation: revealUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
        }

        h1 .hero-text-line:nth-child(2) span {
            animation-delay: 0.1s;
        }

        h1 .hero-text-line:nth-child(3) span {
            animation-delay: 0.2s;
        }

        .hero-subtext {
            animation: revealUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
            opacity: 0;
        }

        /* Accessibility */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        :focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }

        @keyframes float-slow {

            0%,
            100% {
                transform: translate(0, 0);
            }

            33% {
                transform: translate(30px, -50px);
            }

            66% {
                transform: translate(-20px, 20px);
            }
        }

        .animate-float-slow {
            animation: float-slow 20s ease-in-out infinite;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-deep-green dark:text-white antialiased">
    <app-root></app-root>
</body>

</html>
